<title>Warzone Deckbuilder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: iPad-landscape console with no page scroll. Top bar → full-width battlefield strip (the circle) → three columns: operators + log | hand | weapons + actions. Portrait/phones fall back to a scrolling stack. */
:root {
  --bg:#E2E4D6; --surface:#F3F4EB; --surface2:#E9EBDF; --ink:#1C2017; --muted:#5B6152; --line:#C2C5B0;
  --olive:#475827; --signal:#C2531A; --danger:#AE2A20; --gas:#8E9C1C; --gasbg:#E3E7B6; --good:#2F7A45;
  --c-move:#2D69AE; --c-prec:#C2531A; --c-intel:#1C7C76; --c-ammo:#9A7116; --c-def:#475827; --c-eva:#6A57A3;
  --f-display:'Saira Stencil One', Impact, 'Arial Black', sans-serif;
  --f-body:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r:6px; --gap: 8px; --top: 44px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#13170F; --surface:#1D2318; --surface2:#262D20; --ink:#E2E5D4; --muted:#9AA18A; --line:#373F2D;
  --olive:#A4B66A; --signal:#EE8438; --danger:#E5574B; --gas:#C3D34C; --gasbg:#2A3114; --good:#6CC287;
  --c-move:#6CA4E8; --c-prec:#EE8438; --c-intel:#4EC0B8; --c-ammo:#D8AD48; --c-def:#A4B66A; --c-eva:#A894E0;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#13170F; --surface:#1D2318; --surface2:#262D20; --ink:#E2E5D4; --muted:#9AA18A; --line:#373F2D;
  --olive:#A4B66A; --signal:#EE8438; --danger:#E5574B; --gas:#C3D34C; --gasbg:#2A3114; --good:#6CC287;
  --c-move:#6CA4E8; --c-prec:#EE8438; --c-intel:#4EC0B8; --c-ammo:#D8AD48; --c-def:#A4B66A; --c-eva:#A894E0;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.3; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
svg.i { width: 14px; height: 14px; flex: none; vertical-align: -2px; }
.c-move { color: var(--c-move); } .c-prec { color: var(--c-prec); } .c-intel { color: var(--c-intel); } .c-ammo { color: var(--c-ammo); } .c-def { color: var(--c-def); } .c-eva { color: var(--c-eva); }
.game, .start, .layer-ui { -webkit-touch-callout: none; }
.game { -webkit-user-select: none; user-select: none; }

/* ===== game grid (landscape) ===== */
.game { height: 100%; max-height: 100dvh; display: grid; gap: var(--gap); padding: 6px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
  grid-template-columns: clamp(250px, 24vw, 310px) minmax(0, 1fr) clamp(270px, 27vw, 340px);
  grid-template-rows: var(--top) clamp(170px, 30vh, 250px) minmax(0, 1fr);
  grid-template-areas: "top top top" "field field field" "left hand right"; overflow: hidden; }
.top { grid-area: top; display: flex; align-items: center; gap: 10px; min-width: 0; }
.fieldwrap { grid-area: field; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
.left { grid-area: left; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); }
.handzone { grid-area: hand; min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
.right { grid-area: right; min-height: 0; display: flex; flex-direction: column; gap: var(--gap); overflow: hidden; }
.left { overflow: hidden; }

/* top bar */
.brand { font-family: var(--f-display); font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); margin-left: 4px; }
.turnpill { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.turnpill.mine { background: var(--signal); color: var(--surface); border-color: var(--signal); }
.hint { font-size: 13.5px; color: var(--muted); min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hint b { color: var(--ink); }
.roundinfo { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.roundinfo b { color: var(--ink); font-family: var(--f-mono); }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 10px; cursor: pointer; min-height: 34px; }
.iconbtn:hover { border-color: var(--muted); }

/* battlefield strip */
.field-head { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.field-head b { color: var(--ink); }
.field-head .distchip { margin-left: auto; font-weight: 700; color: var(--ink); }
.field { flex: 1; min-height: 0; display: flex; gap: 5px; }
.env { flex: 1 1 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; position: relative; overflow: hidden; transition: flex .35s ease, background .2s, border-color .2s; }
.env.gas { flex: 0 0 26px; background: var(--gasbg); border-color: var(--gas); cursor: default; }
.env.gas .env-body, .env.gas .env-state { display: none; }
.env.gas::after { content: "GAS"; position: absolute; inset: 0; display: grid; place-items: center; writing-mode: vertical-rl; font-weight: 700; font-size: 10px; letter-spacing: .3em; color: var(--gas); }
.env.gas.occupied::after { content: "IN GAS"; color: var(--danger); }
.env.gas.occupied { border-color: var(--danger); }
.env-state { font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 6px; background: var(--surface2); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.env.warn .env-state { background: repeating-linear-gradient(135deg, var(--gas) 0 6px, var(--gasbg) 6px 12px); color: var(--ink); }
.env.drop .env-state { background: var(--c-intel); color: var(--surface); }
.env-body { padding: 4px 6px 6px; display: flex; flex-direction: column; gap: 3px; flex: 1; min-height: 0; }
.env-name { font-weight: 700; font-size: 13px; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.env-stats { font-size: 11px; color: var(--muted); display: flex; gap: 5px; flex-wrap: wrap; line-height: 1.2; }
.cover-hard { color: var(--ink); font-weight: 700; }
.tokens { display: flex; gap: 3px; min-height: 18px; flex-wrap: wrap; }
.tok { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 5px; border-radius: 3px; text-transform: uppercase; }
.tok.me { background: var(--signal); color: var(--surface); }
.tok.them { background: var(--danger); color: var(--surface); }
.loot { display: flex; flex-direction: column; gap: 3px; margin-top: auto; min-height: 0; overflow: hidden; }
.loot-it { text-align: left; font-size: 11.5px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface2); cursor: pointer; display: flex; justify-content: space-between; gap: 4px; line-height: 1.15; min-width: 0; }
.loot-it > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.loot-it.hidden { color: var(--muted); font-style: italic; cursor: default; background: repeating-linear-gradient(45deg, var(--surface2) 0 4px, var(--surface) 4px 8px); }
.loot-it .k { font-family: var(--f-mono); font-size: 11px; color: var(--c-intel); white-space: nowrap; }
.loot-it.weapon { border-left: 3px solid var(--signal); }
.loot-it.att { border-left: 3px solid var(--c-ammo); }
.loot-more { font-size: 10.5px; color: var(--muted); }
.env.reach { border-color: var(--signal); box-shadow: 0 0 0 2px var(--signal) inset; cursor: pointer; }
.env.reach:hover { background: color-mix(in srgb, var(--surface) 85%, var(--signal) 15%); }
.env.noreach { opacity: .45; }
.env.here { border-color: var(--ink); }
.movego { font-size: 11px; font-weight: 700; background: var(--signal); color: var(--surface); border-radius: 4px; padding: 3px; text-align: center; }

/* panels */
.op { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; display: grid; gap: 5px; min-width: 0; }
.op > * { min-width: 0; }
.op-head { display: flex; align-items: baseline; gap: 6px; }
.op-name { font-family: var(--f-display); font-size: 16px; white-space: nowrap; }
.op-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; margin-left: auto; white-space: nowrap; }
.op-meta b { color: var(--ink); }
.hp { display: flex; align-items: center; gap: 6px; }
.hpbar { flex: 1; height: 10px; background: var(--surface2); border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; min-width: 60px; }
.hpbar i { position: absolute; inset: 0 auto 0 0; background: var(--olive); transition: width .3s; }
.hpbar.low i { background: var(--danger); }
.hpbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(4% - 1px), var(--surface) calc(4% - 1px) 4%); opacity: .55; }
.hp .mono { font-size: 13px; min-width: 42px; text-align: right; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 99px; background: var(--surface2); white-space: nowrap; }
.chip.warn { border-color: var(--signal); color: var(--signal); }
.opp-weps { display: flex; gap: 5px; flex-wrap: wrap; font-size: 12px; }
.mini-wep { display: flex; align-items: center; gap: 5px; padding: 3px 6px; background: var(--surface2); border-radius: 4px; border: 1px solid var(--line); cursor: pointer; }
.ready { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; }
.ready.on { background: var(--good); color: var(--surface); }
.ready.off { background: transparent; color: var(--muted); border: 1px dashed var(--muted); }
.res { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.res > div { background: var(--surface2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 4px; display: flex; flex-direction: column; align-items: center; }
.res b { font-family: var(--f-mono); font-size: 18px; line-height: 1.1; }
.res span { font-size: 9.5px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.res > div.zero { opacity: .5; }
.statusline { display: flex; flex-wrap: wrap; gap: 4px; }

/* log */
.logbox { flex: 1 1 0; min-height: 60px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; }
.logbox .lh { padding: 5px 10px 3px; }
.logbox ol { margin: 0; padding: 0 10px 8px; list-style: none; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; overflow-y: auto; flex: 1; min-height: 0; }
.logbox li { padding-left: 7px; border-left: 2px solid var(--line); }
.logbox li.hit { border-color: var(--good); } .logbox li.miss { border-color: var(--muted); color: var(--muted); }
.logbox li.gas { border-color: var(--gas); } .logbox li.round { border-color: var(--ink); font-weight: 700; margin-top: 3px; }
.logbox li.fx { border-color: var(--c-intel); } .logbox li.win { border-color: var(--signal); font-weight: 700; }
.logbox li.sys { color: var(--muted); font-size: 11.5px; }

/* hand */
.hand-head { display: flex; align-items: baseline; gap: 8px; }
.hand-head .note { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hand { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 6px; align-content: stretch; }
.hand.many { grid-template-rows: repeat(2, minmax(0, 1fr)); }
.inplay { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--arch, var(--muted)); border-radius: var(--r); display: flex; flex-direction: column; text-align: left; padding: 0; cursor: pointer; min-width: 0; min-height: 0; overflow: hidden; transition: transform .12s, box-shadow .12s; }
.tc:hover:not(:disabled):not(div) { transform: translateY(-2px); box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 18%, transparent); }
.tc:active:not(:disabled):not(div) { transform: scale(.97); }
.hand .tc { max-height: 210px; }
.tc.sel { box-shadow: 0 0 0 2px var(--signal); }
.tc.elig { box-shadow: 0 0 0 2px var(--good); }
.tc.inel { opacity: .4; }
.tc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; padding: 5px 7px 2px; }
.tc-name { font-weight: 700; font-size: 13.5px; line-height: 1.1; }
.hm { display: flex; gap: 1px; color: var(--ink); flex: none; }
.hm svg { width: 13px; height: 13px; }
.hm.z { color: var(--line); }
.tc-main { padding: 1px 7px 4px; font-size: 12.5px; line-height: 1.25; }
.tc-boost { margin: 0 5px; padding: 4px 5px; background: var(--surface2); border-radius: 4px; font-size: 11.5px; line-height: 1.2; display: grid; gap: 2px; min-height: 0; overflow: hidden; }
.tc-foot { display: flex; justify-content: space-between; align-items: center; padding: 4px 7px 5px; font-size: 10.5px; color: var(--muted); gap: 4px; margin-top: auto; white-space: nowrap; overflow: hidden; }
.cost { font-family: var(--f-mono); color: var(--c-intel); font-weight: 600; white-space: nowrap; }
.a-starter { --arch: var(--muted); } .a-rungun { --arch: var(--c-move); } .a-entrenched { --arch: var(--c-ammo); } .a-deadeye { --arch: var(--c-prec); } .a-scavenger { --arch: var(--c-intel); }
.tagc { color: var(--arch); }
.req { font-family: var(--f-mono); font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; background: var(--ink); color: var(--surface); white-space: nowrap; display: inline-flex; align-items: center; vertical-align: 1px; }
.reqin { display: inline-flex; align-items: center; gap: 1px; letter-spacing: .06em; }
.reqin svg.i { width: 11px; height: 11px; vertical-align: 0; }
.reqin svg.i:first-of-type { margin-left: 3px; }
.reqin b { font-weight: 700; margin-left: 1px; }
.ri { display: inline-flex; vertical-align: -2px; margin: 0 1px; }
.ri svg.i { width: 13px; height: 13px; }
.tc-boost .req { justify-self: start; }
.empty-hand { color: var(--muted); font-size: 13px; padding: 10px 2px; grid-column: 1 / -1; }

/* weapons */
.weps { display: flex; flex-direction: column; gap: 4px; min-height: 0; flex: 1 1 auto; overflow: hidden; }
.wcard.back .w-body { gap: 3px; padding: 4px 8px 5px; }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.wcard.active { border-color: var(--ink); }
.wsn { display: none; text-transform: none; letter-spacing: .02em; }
.w-slot { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 3px 8px; background: var(--ink); color: var(--surface); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.wcard.back .w-slot { background: var(--surface2); color: var(--muted); }
.w-body { padding: 5px 8px 7px; display: grid; gap: 4px; }
.w-name { font-family: var(--f-display); font-size: 16px; line-height: 1.05; display: flex; justify-content: space-between; gap: 6px; align-items: baseline; }
.w-name .cost { font-size: 11px; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.stats > div { display: flex; flex-direction: column; align-items: center; background: var(--surface2); border-radius: 3px; padding: 1px 0; }
.stats b { font-family: var(--f-mono); font-size: 13.5px; }
.stats span { font-size: 9px; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 2px; }
.stats svg.i { width: 10px; height: 10px; }
.stats b.mod { color: var(--signal); }
.ammo { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.ammo i { width: 6px; height: 13px; border-radius: 3px 3px 1px 1px; background: var(--c-ammo); }
.ammo i.e { background: transparent; border: 1px dashed var(--line); }
.ammo .mono { font-size: 11px; margin-left: 4px; color: var(--muted); }
.tact { font-size: 12px; line-height: 1.25; }
.tact .req { margin-right: 4px; }
.tact .t2 { color: var(--muted); display: block; margin-top: 1px; }
.wempty { padding: 5px 8px; color: var(--muted); font-size: 12px; }
.wbtns { display: flex; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 7px 12px; border-radius: var(--r); font-weight: 700; letter-spacing: .03em; cursor: pointer; min-height: 34px; transition: transform .08s, filter .12s; }
.btn:hover:not(:disabled) { filter: brightness(1.1); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.alt { background: transparent; color: var(--ink); }
.btn.sig { background: var(--signal); border-color: var(--signal); color: var(--surface); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.wide { flex: 1; }
.btn.sm { padding: 4px 9px; min-height: 28px; font-size: 12.5px; }
.switchbtn { border: 1.5px dashed var(--olive); color: var(--olive); background: transparent; border-radius: 99px; padding: 3px 10px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; align-self: center; }
.switchbtn:disabled { opacity: .4; cursor: not-allowed; }

/* actions */
.abar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 8px; display: grid; gap: 6px; flex: 0 0 auto; }
.abar-info { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
.pips i.f { background: var(--ink); }
.abtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.abtn { position: relative; border: 1px solid var(--line); background: var(--surface2); border-radius: var(--r); padding: 5px 2px 4px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; font-weight: 700; letter-spacing: .03em; cursor: pointer; min-height: 44px; transition: transform .08s, border-color .12s; }
.abtn:hover:not(:disabled) { border-color: var(--muted); }
.abtn:active:not(:disabled) { transform: scale(.96); }
.abtn svg { width: 17px; height: 17px; }
.abtn small { font-family: var(--f-mono); font-size: 10px; font-weight: 600; color: var(--muted); }
.abtn:disabled { opacity: .38; cursor: not-allowed; }
.abtn.on { border-color: var(--signal); background: var(--signal); color: var(--surface); }
.abtn.on small { color: var(--surface); }
.abtn.go { border-color: var(--good); }
.abtn .bad { position: absolute; top: -6px; right: -3px; background: var(--good); color: var(--surface); font-family: var(--f-mono); font-size: 10px; padding: 0 4px; border-radius: 99px; }

/* sheets: centered dialogs that fit the screen */
.scrim { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 12px; }
.sheet { background: var(--bg); width: 100%; max-width: 760px; max-height: calc(100dvh - 24px); overflow-y: auto; border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; border-top: 3px solid var(--ink); }
.sheet.wide { max-width: 980px; }
.sheet h2 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0; text-wrap: balance; }
.sheet h3 { margin: 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sheet-head { display: flex; align-items: center; gap: 8px; }
.sheet-head .x { margin-left: auto; }
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; align-items: start; }
.cols > * { min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.picker .tc { min-height: 120px; }
.picker .tc .tc-boost, .picker .tc .tc-foot { display: none; }
.preview { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; font-size: 13px; display: grid; gap: 3px; }
.preview .lbl { margin-right: 6px; }
.big .tc { width: 240px; min-height: 240px; cursor: default; }
.big .tc-name { font-size: 17px; } .big .tc-main { font-size: 14px; } .big .tc-boost { font-size: 13px; }
.big .hm svg { width: 18px; height: 18px; }
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--ink); background: var(--surface); font-weight: 700; font-size: 18px; cursor: pointer; }
.stepper b { font-family: var(--f-mono); font-size: 20px; min-width: 28px; text-align: center; }
.brk { width: 100%; border-collapse: collapse; font-size: 13px; }
.brk td { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.brk td:last-child { text-align: right; font-family: var(--f-mono); }
.brk tr.tot td { border-bottom: 0; font-weight: 700; font-size: 15px; }
.odds { font-family: var(--f-mono); font-size: 28px; }
.reveal { display: flex; gap: 6px; flex-wrap: wrap; }
.rv { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 5px 8px; font-size: 12.5px; display: flex; gap: 6px; align-items: center; animation: flip .35s ease both; }
.rv:nth-child(2) { animation-delay: .12s } .rv:nth-child(3) { animation-delay: .24s } .rv:nth-child(4) { animation-delay: .36s } .rv:nth-child(5) { animation-delay: .48s } .rv:nth-child(n+6) { animation-delay: .6s }
@keyframes flip { from { transform: rotateY(80deg); opacity: .2 } to { transform: none; opacity: 1 } }
.verdict { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.verdict.hit { color: var(--good); } .verdict.miss { color: var(--muted); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
.tabs button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.grid-cards .tc { cursor: default; min-height: 190px; }
.rules { font-size: 14px; columns: 2 300px; column-gap: 24px; }
.rules h4 { margin: 8px 0 2px; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; break-after: avoid; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; break-inside: avoid; }
.lootlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.lootpick { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 3px; cursor: pointer; font-size: 12.5px; }
.lootpick.on { border-color: var(--signal); box-shadow: 0 0 0 2px var(--signal); }
.lootpick:disabled { opacity: .45; cursor: not-allowed; }
.lootpick .ln { font-weight: 700; font-size: 14px; display: flex; justify-content: space-between; gap: 6px; }
.lootpick .lk { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 20px; z-index: 30; background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: var(--r); font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.tip-pop { position: fixed; z-index: 50; max-width: min(320px, calc(100vw - 24px)); background: var(--ink); color: var(--surface); border-radius: 6px; padding: 8px 10px; font-size: 13px; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,.35); pointer-events: none; }
.tip-pop b { font-weight: 700; }
.holding { outline: 2px solid var(--signal); outline-offset: 1px; }

/* start */
.start { height: 100%; overflow-y: auto; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.start-in { max-width: 820px; display: grid; gap: 16px; }
.start h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(38px, 8vh, 64px); line-height: .92; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.start h1 span { color: var(--signal); }
.start p { margin: 0; font-size: 15.5px; max-width: 62ch; color: var(--muted); }
.start .ver { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.archs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.archs div { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--arch); border-radius: 4px; padding: 7px 9px; font-size: 12.5px; }
.archs b { display: block; font-size: 14px; }
.hand-off { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; place-items: center; text-align: center; padding: 24px; }
.hand-off h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0 0 8px; }

/* small landscape heights: tighten */
@media (orientation: landscape) and (max-height: 780px) {
  .game { grid-template-rows: 40px clamp(165px, 30vh, 215px) minmax(0, 1fr); --top: 40px; }
  .tc-boost { font-size: 11px; }
  .op { padding: 5px 9px; gap: 4px; }
  .tact .t2 { display: none; }
  .wsn { display: inline; }
  .wcard .w-name { display: none; }
  .wcard .w-body { gap: 3px; padding: 4px 8px 5px; }
  .abtn { min-height: 40px; padding: 3px 2px; }
}

/* portrait & phones: scrolling stack */
@media (orientation: portrait), (max-width: 860px) {
  html, body { height: auto; }
  .game { height: auto; overflow: visible; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; grid-template-areas: "top" "field" "left" "hand" "right"; }
  .top { flex-wrap: wrap; }
  .hint { white-space: normal; flex-basis: 100%; order: 5; }
  .field { overflow-x: auto; min-height: 190px; }
  .env { flex: 0 0 120px; }
  .env.gas { flex: 0 0 26px; }
  .hand { grid-template-rows: none; grid-auto-rows: auto; }
  .hand .tc { min-height: 170px; max-height: none; }
  .logbox { max-height: 260px; }
  .cols { grid-template-columns: 1fr; }
  .archs { grid-template-columns: repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* inside / outside slots */
.env-body[data-act] { cursor: pointer; }
.slot-in, .slot-out { border-radius: 4px; padding: 2px 4px 3px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: hidden; }
.slot-in { border: 1px dashed var(--line); background: var(--surface2); flex: 1 1 auto; }
.slot-in.held { border-style: solid; border-color: var(--ink); }
.slot-in.none { flex: 0 0 auto; background: transparent; }
.slot-out { border-top: 1px solid var(--line); border-radius: 0; flex: 0 0 auto; padding-top: 3px; }
.sl { font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sl .ri svg.i { width: 10px; height: 10px; }
.cache { align-self: flex-start; font-family: var(--f-mono); font-size: 10px; font-weight: 600; padding: 1px 5px; border-radius: 3px; border: 1px dashed var(--c-intel); color: var(--c-intel); white-space: nowrap; }
.cache.crate { border-style: solid; background: var(--c-intel); color: var(--surface); }
.mvopts { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
.mvopt { border: 1px solid var(--signal); background: var(--surface); color: var(--signal); border-radius: 4px; padding: 5px 4px; font-weight: 700; font-size: 12px; cursor: pointer; white-space: nowrap; }
.mvopt.in { background: var(--signal); color: var(--surface); }
.mvopt.breach { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.mvopt:active { transform: scale(.96); }
.env-stats svg.i { width: 11px; height: 11px; }
.abtn.search { background: var(--c-intel); border-color: var(--c-intel); }

const COND_LABEL = { notMoved: "haven't moved", movedToward: 'moved toward enemy', shareOrAdjacent: 'same or adjacent space', oppDist3: 'enemy at Distance 3+' };

// ---------- effect builders ----------
const gain = (res, n) => ({ op: 'gain', res, n });
const convert = (from, to, max) => ({ op: 'convert', from, to, max });
const draw = n => ({ op: 'draw', n });
const bonus = (type, n = 1) => ({ op: 'bonus', type, n });
const nextFire = o => Object.assign({ op: 'nextFire' }, o);
const cond = (iff, then) => ({ op: 'cond', if: iff, then });
const register = (on, label, then) => ({ op: 'register', on, label, then });

// ---------- TACTICAL CARDS (prototype values: tune freely) ----------
const CARDS = {};
function TC(id, name, archetype, hm, cost, copies, main, mainText, req, boost, boostText, hybrid) {
  CARDS[id] = {
    id, name, archetype, hit_markers: hm, intel_cost: cost, copies,
    main_effects: main, main_text: mainText,
    boost_requirement_type: req === 0 ? 'any' : 'min', boost_min_hit_markers: req,

    rarity_or_tier: cost >= 4 ? 'Elite' : cost === 3 ? 'Advanced' : cost === 2 ? 'Standard' : 'Starter',
    art_reference: 'placeholder/' + id,
    tags: [ARCH_TAG[archetype]].concat(hybrid ? ['Hybrid'] : []),
  };
}
// Starter deck (confirmed)
TC('T001', 'Basic Sprint', 'starter', 0, 0, 3, [gain('move', 2)], 'Gain 2 Movement.', 0, [gain('move', 1)], 'Gain 1 additional Movement.');
TC('T002', 'Basic Recon', 'starter', 0, 0, 2, [gain('intel', 2)], 'Gain 2 Intel.', 0, [gain('intel', 1)], 'Gain 1 additional Intel.');

TC('T106', 'Adrenaline Rush', 'rungun', 1, 3, 2, [gain('move', 3)], 'Gain 3 Movement.', 1, [register('moveToward', 'next Move toward enemy: +2 Precision', [gain('prec', 2)])], 'Your next Move toward the opponent grants 2 Precision after it resolves.');

TC('T201', 'Ammo Crate', 'entrenched', 1, 2, 3, [gain('ammo', 3)], 'Gain 3 Ammo.', 0, [gain('def', 2)], 'Gain 2 Defense.');

TC('T206', 'Recoil Management', 'entrenched', 2, 3, 2, [gain('prec', 2)], 'Gain 2 Precision.', 1, [nextFire({ recoilIgnore: 2 })], 'Reduce your Active weapon’s recoil penalty by 2 on its next Fire this round (min 0).');

TC('T301', 'Hold Breath', 'deadeye', 2, 3, 2, [gain('prec', 3)], 'Gain 3 Precision.', 0, [nextFire({ recoilIgnore: 1 })], 'Your next Fire ignores 1 Recoil.');
TC('T302', 'Target Lock', 'deadeye', 2, 3, 2, [gain('prec', 2)], 'Gain 2 Precision.', 1, [nextFire({ reqMod: 1 })], 'Your next Fire requires 1 fewer Hit Marker (min 1).');
TC('T303', 'Patient Hunter', 'deadeye', 3, 4, 1, [gain('prec', 2)], 'Gain 2 Precision.', 2, [cond('notMoved', [draw(1)])], "Draw 1 card if you haven't moved this round.");
TC('T304', 'Steady Trigger', 'deadeye', 2, 4, 1, [gain('prec', 3)], 'Gain 3 Precision.', 2, [nextFire({ reqMod: 2 })], 'Your next Fire requires 2 fewer Hit Markers (min 1).');

TC('T405', 'Resourceful Operator', 'scavenger', 1, 2, 3, [gain('move', 1), gain('ammo', 1), gain('intel', 1)], 'Gain 1 Movement, 1 Ammo and 1 Intel.', 0, [gain('prec', 1)], 'Gain 1 Precision.', true);

function WD(id, name, archetype, damage, range, mobility, mag, diff, recoil, cost, main, mainText, req, boost, boostText, gather, gatherText, hybrid, cls) {

WD('W001', 'Viper SMG', 'rungun', 3, 4, 6, 5, 0, 1, 2, [gain('move', 1)], 'Gain 1 Movement.', 0, [convert('move', 'prec', 3)], 'Spend up to 3 Movement to gain that much Precision.', [gain('move', 2)], 'Gain 2 Movement.', false, 'SMG');
WD('W002', 'Breacher Shotgun', 'rungun', 5, 2, 4, 3, 1, 1, 2, [gain('move', 1), gain('eva', 1)], 'Gain 1 Movement and 1 Evasion.', 1, [register('enterEnemy', "enter enemy's space: bonus Fire", [bonus('fire')])], "If you then enter the enemy’s environment this round, gain 1 bonus Fire action.", [gain('def', 2)], 'Gain 2 Defense.', false, 'Shotgun');
WD('W003', 'Bastion LMG', 'entrenched', 5, 6, 2, 5, 1, 2, 3, [gain('ammo', 2)], 'Gain 2 Ammo.', 0, [convert('ammo', 'def', 3)], 'Spend up to 3 Ammo to gain that much Defense.', [gain('ammo', 2)], 'Gain 2 Ammo.', false, 'LMG');

// ---------- helpers ----------
function rng(s) {

function itemDef(s, item) {

function mkPlayer(idx, name) {

    idx, name, hp: 25, pos: 0, res: { move: 0, prec: 0, intel: 0, ammo: 0 }, def: 0, eva: 0,
    deck: [], discard: [], hand: [], play: [], removed: [],
    active: null, back: null, freeSwitch: true, actions: 3,
    bonus: { move: 0, fire: 0, loot: 0, reload: 0 }, bonusPending: { move: 0, fire: 0, loot: 0, reload: 0 },
    inside: false, bonusTaken: [], pendingSearch: null, moved: false, movedToward: false, nextFire: { reqMod: 0, recoilIgnore: 0, bonusPrec: 0 },
    suppress: null, triggers: [], lootDiscount: 0, finished: false, activated: [],

function newCard(s, def) { const iid = 'c' + (s.nid++); s.cards[iid] = { iid, def }; return iid; }
function newWeapon(s, def) { const iid = 'w' + (s.nid++); s.weapons[iid] = { iid, def, ammo: WEAPONS[def].starting_ammo, shots: 0, used: false, att: null, loc: null }; return iid; }

function addEnv(s, w, state) {

  let pick = s.envBag.pop();
  const nb = s.envs.find(e => e.w === w + 1) || s.envs.find(e => e.w === w - 1);
  if (nb && nb.def === pick && s.envBag.length) { const alt = s.envBag.pop(); s.envBag.unshift(pick); pick = alt; }
  const env = { w, def: pick, state, loot: [], cache: { reveal: ENVS[pick].search[0], keep: ENVS[pick].search[1], searched: false }, crate: null };
  s.envs.push(env); s.envs.sort((a, b) => a.w - b.w);

}
function reveal() { return 0; }
const hasInside = env => env.state === 'safe' && ENVS[env.def].entry != null;

function drawCards(s, p, n) {

      if (!pl.discard.length) break;
      pl.deck = shuffle(s, pl.discard); pl.discard = [];

}

// ---------- game setup ----------
function newGame(opts = {}) {

    v: '2.1', seed: (opts.seed ?? (Date.now() & 0x7fffffff)) | 0, round: 1, first: 0, turn: 0, over: false, winner: null,
    log: [], nid: 1, cards: {}, weapons: {}, atts: {}, envs: [], lootDeck: [], envBag: [], players: [], mode: opts.mode || 'ai', lastFire: null,
  };
  s.players = [mkPlayer(0, (opts.names && opts.names[0]) || 'You'), mkPlayer(1, (opts.names && opts.names[1]) || 'Rival')];
  for (const pl of s.players) {
    for (const id of ['T001', 'T002', 'T003', 'T004', 'T005']) for (let c = 0; c < CARDS[id].copies; c++) pl.deck.push(newCard(s, id));
    shuffle(s, pl.deck);
  }
  for (const id in CARDS) if (CARDS[id].archetype !== 'starter') for (let c = 0; c < CARDS[id].copies; c++) s.lootDeck.push({ kind: 'card', iid: newCard(s, id) });
  for (const id in WEAPONS) for (let c = 0; c < WEAPON_COPIES[id]; c++) { const iid = newWeapon(s, id); s.weapons[iid].loc = { deck: true }; s.lootDeck.push({ kind: 'weapon', iid }); }
  for (const id in ATTS) s.lootDeck.push({ kind: 'att', iid: newAtt(s, id) });
  shuffle(s, s.lootDeck);
  for (let w = 0; w < TUNE.zones; w++) addEnv(s, w, 'safe');
  s.closeSide = 'right'; s.finalDmg = 0;
  s.players[0].pos = TUNE.startB; s.players[1].pos = TUNE.startA;
  if (rng(s) < 0.5) { s.players[0].pos = TUNE.startA; s.players[1].pos = TUNE.startB; }
  s.first = rng(s) < 0.5 ? 0 : 1; s.turn = s.first;
  s.closeSide = s.players[s.first].pos === TUNE.startB ? 'right' : 'left'; // the first player's side closes first
  // guarantee an accessible starting firearm at each operator's location
  for (const pl of s.players) {
    const idx = s.lootDeck.findIndex(it => it.kind === 'weapon' && WEAPONS[s.weapons[it.iid].def].intel_cost === 2);
    if (idx >= 0) { const it = s.lootDeck.splice(idx, 1)[0]; envAt(s, pl.pos).loot.push(Object.assign(it, { revealed: true, out: true })); s.weapons[it.iid].loc = { env: pl.pos }; }
  }

}
function safeBounds(s) { const w = s.envs.filter(e => e.state === 'safe').map(e => e.w); return { lo: Math.min(...w), hi: Math.max(...w), n: w.length }; }

// ---------- effects ----------
function checkCond(s, p, c) {

}

      if (e.reqMod) ctx.out.push(`Next Fire −${e.reqMod} required`);
      if (e.recoilIgnore) ctx.out.push(`Next Fire ignores ${e.recoilIgnore} Recoil`);

}

// ---------- validation ----------
function prepCheck(s, p) {
  if (s.over) return fail('The match is over.');
  if (s.turn !== p) return fail("It isn't your turn.");
  if (P(s, p).finished) return fail('You have finished this round.');
  if (P(s, p).pendingSearch) return fail('Finish your search first: choose what stays here.');
  return null;
}
function boostOk(s, p, reqType, min, boostIid, mainIid) {
  const pl = P(s, p);

  if (boostIid === mainIid) return 'A card cannot Boost itself.';
  if (reqType === 'min' && hmOf(s, boostIid) < min) return `Boost needs one card with ${min}+ Hit Markers.`;
  return null;
}

// ---------- prep operations (no Tactical Action) ----------
function playCard(s, p, iid, boostIid, ch) {
  const pl = P(s, p); const e = prepCheck(s, p); if (e) return e;
  if (!pl.hand.includes(iid)) return fail('That card is not in your hand.');
  const def = cardDef(s, iid);
  if (boostIid) { const b = boostOk(s, p, def.boost_requirement_type, def.boost_min_hit_markers, boostIid, iid); if (b) return fail(b); }
  pl.hand.splice(pl.hand.indexOf(iid), 1); pl.play.push(iid);
  if (boostIid) { pl.hand.splice(pl.hand.indexOf(boostIid), 1); pl.play.push(boostIid); }
  const ctx = { out: [], exclude: [iid, boostIid].filter(Boolean), src: def.name };
  runEffects(s, p, def.main_effects, ch, ctx);
  if (boostIid) { runEffects(s, p, def.boost_effects, ch, ctx); pl.stats.boosts++; }
  pl.stats.cardsPlayed++;
  log(s, `${pl.name} plays ${def.name}${boostIid ? ` (Boosted with ${cardDef(s, boostIid).name})` : ''}: ${ctx.out.join(', ')}.`, 'play');
  return { ok: true, out: ctx.out };
}

function activateWeapon(s, p, boostIid, ch) {
  const pl = P(s, p); const e = prepCheck(s, p); if (e) return e;
  if (!pl.active) return fail('No Active weapon to activate.');
  const W = s.weapons[pl.active]; const def = WEAPONS[W.def];
  if (W.used) return fail(`${def.name}’s Tactical Effect is already used this round.`);
  if (boostIid) { const b = boostOk(s, p, def.tactical_boost_requirement, def.tactical_boost_min_hit_markers, boostIid, null); if (b) return fail(b); }
  W.used = true;
  if (boostIid) { pl.hand.splice(pl.hand.indexOf(boostIid), 1); pl.play.push(boostIid); }
  const ctx = { out: [], exclude: [boostIid].filter(Boolean), src: def.name };
  runEffects(s, p, def.tactical_main_effects, ch, ctx);
  if (eff(s, pl.active).special === 'rail') { pl.res.move += 1; ctx.out.push('+1 Movement (Utility Rail)'); }
  if (boostIid) { runEffects(s, p, def.tactical_boost_effects, ch, ctx); pl.stats.boosts++; }
  pl.stats.activations++;
  if (!pl.activated.includes(W.iid)) pl.activated.push(W.iid);
  log(s, `${pl.name} activates ${def.name}${boostIid ? ` (Boosted with ${cardDef(s, boostIid).name})` : ''}: ${ctx.out.join(', ')}.`, 'play');
  return { ok: true, out: ctx.out };
}

function switchWeapons(s, p) {
  const pl = P(s, p); const e = prepCheck(s, p); if (e) return e;
  if (!pl.freeSwitch) return fail('Free switch already used this round.');
  if (!pl.active && !pl.back) return fail('No weapons to switch.');
  [pl.active, pl.back] = [pl.back, pl.active]; pl.freeSwitch = false;
  if (pl.active) s.weapons[pl.active].loc = { owner: p, slot: 'active' };
  if (pl.back) s.weapons[pl.back].loc = { owner: p, slot: 'back' };
  log(s, `${pl.name} switches weapons (free). Active: ${pl.active ? WEAPONS[s.weapons[pl.active].def].name : 'none'}.`, 'play');
  return { ok: true };
}

// ---------- Tactical Actions ----------

}

}

    const cache = e.cache && !e.cache.searched ? `<span class="cache" data-tip="Unsearched cache: the first operator to search ${d.entry != null ? 'from inside ' : ''}reveals ${e.cache.reveal} items and chooses ${e.cache.keep} to leave here. The rest go back.">Cache ${e.cache.reveal}→${e.cache.keep}</span>` : '';
    const crate = drop ? `<span class="cache crate" data-tip="Supply crate: the first operator here searches it (free, from outside) and keeps ${WD.TUNE.crate[1]} of ${WD.TUNE.crate[0]} items (2 weapons, 4 others) on this location.">Crate ${WD.TUNE.crate[0]}→${WD.TUNE.crate[1]}</span>` : '';

    const cover = d.cover ? `<span class="${d.hard ? 'cover-hard' : ''}">${d.hard ? 'Hard' : 'Soft'} −${d.cover}</span>` : '<span>No cover</span>';
    let body;
    if (opts.length) {
      body = `<div class="mvopts">${opts.map(o => `<button class="mvopt ${o.inside ? (o.breach ? 'breach' : 'in') : ''}" data-act="moveto" data-id="${e.w}" data-x="${o.inside ? 'in' : 'out'}" data-tip="${o.inside ? (o.breach ? `Breach: someone holds ${escA(d.name)}. You go in anyway (+1 Movement); both of you are at close quarters with no cover.` : `Move here and go inside: ${o.cost} Movement total.`) : `Move here and stay outside: ${o.cost} Movement (1 per space).`}">${o.inside ? (o.breach ? 'Breach' : (e.w === me.pos ? 'Go in' : 'In')) : 'Out'} · ${o.cost}</button>`).join('')}</div>`;
    } else {

        <div class="slot-out"><span class="sl">Outside</span>${outP}${crate}${d.entry == null ? cache : ''}${list(outLoot, 1)}</div>`;
    }
    const tip = `${d.name}. Moving here costs 1 per space; ${d.entry != null ? `going inside costs ${d.entry} more` : 'no inside'}. ${d.text}${e.w === ne ? ' Gas takes it at the end of this round.' : ''} Tap for details.`;

      <div class="env-body" ${opts.length ? '' : `data-act="loc" data-id="${e.w}"`}><div class="env-name">${d.name}</div>
      <div class="env-stats">${d.entry != null ? `<span title="Entry cost">In ${d.entry}${ic('move', 'c-move')}</span>` : ''}${cover}</div>
      ${body}</div></div>`;
  }).join('');
  const o = OP(); const d = WD.dist(G); const E = me.active ? WD.eff(G, me.active) : null;
  const od = WD.ENVS[WD.envAt(G, o.pos).def];
  const covTxt = o.inside && od.cover && !(me.pos === o.pos && me.inside) ? ` · ${o.name} inside: cover −${od.cover}` : '';
  const rangeTxt = E ? (d <= E.max_range ? (WD.blockedBetween(G) ? ' · <span style="color:var(--danger)">shot blocked by hard cover</span>' : ` · in range (${E.max_range})`) : ` · <span style="color:var(--danger)">out of range (${E.max_range})</span>`) : '';
  return `<section class="fieldwrap" aria-label="Battlefield"><div class="field-head"><span class="lbl">The circle</span><span>1 Movement per space · going inside costs the entry · one operator inside each location (Breach +1)</span><span class="distchip">Distance ${d}${rangeTxt}${covTxt}</span></div>
    <div class="field" id="field">${tiles}</div></section>`;
}

function mePanelHTML(me) {

}

function wepsHTML(me) {

    const iid = me[sl];

    const W = G.weapons[iid]; const def = wdef(iid); const can = myTurn() && sl === 'active' && !W.used;

      ${sl === 'active' ? statsHTML(iid, def) : (() => { const E = WD.eff(G, iid); return `<div class="lbl" data-tip="Damage · Range · Mobility · Difficulty · Recoil">DMG ${E.damage} · RNG ${E.max_range} · MOB ${E.mobility} · DIF ${E.hit_difficulty} · RCL ${E.recoil}</div>`; })()}${ammoHTML(iid, def)}
      ${sl === 'active' ? `<div class="tact" data-tip="${escA('Tactical: ' + def.main_text + ' Boost: ' + def.boost_text + ' On Gather: ' + def.gather_text)}">${fx(def.main_text)}<span class="t2"><span class="req">${reqLabel(def.tactical_boost_requirement, def.tactical_boost_min_hit_markers)}</span>${fx(def.boost_text)}</span></div>
      <div class="wbtns"><button class="btn sig sm wide" data-act="activate" ${can ? '' : 'disabled'}>${W.used ? 'Tactical used this round' : 'Activate Tactical · free'}</button></div>` : ''}

  return `<section class="weps" aria-label="Your weapons">${slot('active')}

function handHTML(me) {

  return `<div class="hand-head"><span class="lbl">Hand · ${me.hand.length}</span><span class="note">Tap to play (optionally Boost with another card). Hold for details.</span></div>
    <div class="hand ${many ? 'many' : ''}">${me.hand.map(iid => cardHTML(WD.cardDef(G, iid), { act: 'card', id: iid })).join('') || '<span class="empty-hand">No cards left in hand. Take actions or Finish the round.</span>'}</div>

function fireOdds() {
  const me = ME(); if (!me.active) return null;
  const sc = WD.shootCheck(G, ui.me); if (!sc.ok) return { err: sc.err };
  const br = WD.requiredBreakdown(G, ui.me); const n = me.res.prec + br.bonusPrec;
  return { pct: Math.round(WD.hitChance(G, ui.me, n, br.total, 250) * 100), req: br.total, n };
}
function abarHTML(me) {
  const t = myTurn(); const has = ty => WD.hasActionType(me, ty);
  const fo = t ? fireOdds() : null; const same = me.pos === OP().pos;
  const here = WD.envAt(G, me.pos); const lootN = here.loot.filter(i => WD.canReach(G, ui.me, i)).length;
  const sch = t ? WD.searchable(G, ui.me) : null; const pend = me.pendingSearch;
  const searchBtn = pend ? `<button class="abtn on search" data-act="searchopen" data-tip="Choose what stays at this location.">${ic('loot')}<span>Keep ${pend.keep}</span><small>finish search</small></button>` : sch ? `<button class="abtn on search" data-act="search" data-tip="Free (no action). Reveal the loot here and choose what stays on this location. Taking it is still a Loot action.">${ic('loot')}<span>Search</span><small>${sch === 'crate' ? 'crate · free' : 'free'}</small></button>` : '';

    return `<button class="abtn ${extra}" data-act="${act}" ${dis ? 'disabled' : ''} data-tip="${escA(tip)}">${bonus}${ic(icon)}<span>${label}</span>${sub ? `<small>${sub}</small>` : ''}</button>`;
  };
  const fireSub = !t ? '' : fo && fo.pct != null ? `${fo.pct}% · need ${fo.req}` : same ? 'Fists 1' : fo && fo.err ? 'no shot' : 'unarmed';
  const fireTip = fo && fo.err ? fo.err : fo && fo.pct != null ? `Commit ${fo.n} Precision to reveal ${fo.n} cards; you need ${fo.req} Hit Markers. Estimated ${fo.pct}%.` : 'Fire your Active weapon or use Fists in the same zone.';

    <div class="abtns">${b('move', 'Move', 'move', 'move', ui.moveMode ? 'on' : '', me.res.move ? `${me.res.move} Mvt` : 'no Mvt', '1 Movement per space. Going inside costs the location’s entry (Breach +1 if someone holds it). Leaving is free. Your Active weapon’s Mobility caps each Move.')}${b('fire', 'Fire', 'fire', 'fire', fo && fo.pct >= 60 ? 'go' : '', fireSub, fireTip)}${b('loot', 'Loot', 'loot', 'loot', '', lootN ? `${lootN} here` : 'nothing', 'Take any number of items you can reach here (inside items need you inside), paying Intel for each.')}${b('reload', 'Reload', 'reload', 'reload', '', me.res.ammo ? `${me.res.ammo} Ammo` : 'no Ammo', 'Load generated Ammo into a weapon.')}${searchBtn || b('wait', 'Wait', 'wait', 'wait', '', '', 'Spend an action doing nothing.')}<button class="abtn" data-act="finish" ${t ? '' : 'disabled'} data-tip="End your round now. Remaining actions are lost.">${ic('end')}<span>Finish</span><small>${me.actions ? `lose ${me.actions}` : ''}</small></button></div>
  </nav>`;
}

function renderLayer() {
  let h = '';
  if (ui.handoff) h += `<div class="hand-off"><div><div class="lbl">Pass &amp; play</div><h2>Pass to ${G.players[G.turn].name}</h2><p style="color:var(--muted)">Hands stay hidden until the next operator taps.</p><button class="btn sig" data-act="takeover">I'm ${G.players[G.turn].name} — show my hand</button></div></div>`;
  if (ui.sheet) h += `<div class="scrim" data-act="scrim"><div class="sheet ${['codex', 'rules', 'loot', 'item', 'card', 'loc', 'search'].includes(ui.sheet.type) ? 'wide' : ''}" role="dialog" aria-modal="true">${sheetHTML()}</div></div>`;
  if (ui.toast) h += `<div class="toast" role="status">${ui.toast}</div>`;

}
function head(title) { return `<div class="sheet-head"><h2>${title}</h2><button class="iconbtn x" data-act="close" aria-label="Close">✕</button></div>`; }
function preview(fn) {
  const clone = JSON.parse(JSON.stringify(G));
  const r = fn(clone);
  return r.ok ? r.out.join(', ') : r.err;
}

function lootSheet(S) {
  const me = ME();
  const env = S.type === 'item' ? G.envs.find(e => e.loot.some(i => i.iid === S.id)) : S.type === 'loc' ? WD.envAt(G, S.w) : WD.envAt(G, me.pos);
  if (!env) return head('Loot') + '<p>That item is gone.</p>';
  const here = env.w === me.pos;
  if (S.type === 'item' && here && !S.converted) { const it0 = env.loot.find(i => i.iid === S.id); S.sel = it0 && WD.canReach(G, ui.me, it0) ? [S.id] : []; S.converted = true; }
  const d0 = WD.ENVS[env.def]; const final0 = WD.safeBounds(G).n <= 1;
  const info = `<div class="preview"><span><b>${d0.name}</b> · 1 Movement per space${d0.entry != null && !final0 ? ` · going inside costs ${d0.entry}` : ' · no inside'} · ${d0.cover ? `${d0.hard ? 'hard' : 'soft'} cover −${d0.cover} (inside only)` : 'no cover'}</span><span>${fx(d0.text)}</span>${env.cache && !env.cache.searched ? `<span>Unsearched cache: search ${d0.entry != null ? 'from inside ' : ''}to reveal ${env.cache.reveal} and leave ${env.cache.keep} here.</span>` : env.cache ? '<span style="color:var(--muted)">Cache already searched.</span>' : ''}${env.crate && !env.crate.searched ? `<span>Supply crate: search it (free, from outside) to keep ${WD.TUNE.crate[1]} of ${WD.TUNE.crate[0]}.</span>` : ''}${G.players.filter(p => p.pos === env.w).map(p => `<span>${p === me ? 'You are' : p.name + ' is'} ${p.inside ? 'inside' : 'outside'}.</span>`).join('')}</div>`;
  const can = myTurn() && here && WD.hasActionType(me, 'loot');
  const items = env.loot;
  let h = head(here ? `${envName(env)} · loot` : `${envName(env)}`) + info;
  if (!here && env.loot.length) h += `<div style="color:var(--muted);font-size:13px">Move to ${envName(env)} to loot it.</div>`;
  const sel = S.sel || [];
  let total = 0;
  sel.forEach((id, i) => { const it = items.find(x => x.iid === id); if (it) total += WD.lootCost(G, ui.me, it, i > 0); });
  const weaponSel = sel.some(id => (items.find(x => x.iid === id) || {}).kind === 'weapon');
  const attSel = sel.some(id => (items.find(x => x.iid === id) || {}).kind === 'att');
  h += `<div class="lootlist">${items.map(it => {
    if (!it.revealed) return `<div class="lootpick" style="cursor:default;color:var(--muted)"><span class="lk">Hidden</span>Revealed when someone enters or passes through.</div>`;
    const def = WD.itemDef(G, it); const cost = WD.lootCost(G, ui.me, it, sel.length > 0 && sel[0] !== it.iid);
    const on = sel.includes(it.iid); const reachIt = here && WD.canReach(G, ui.me, it);
    let body = '';
    if (it.kind === 'card') body = `${hmPips(def.hit_markers)}<span>${fx(def.main_text)}</span><span style="color:var(--muted)"><span class="req">${reqLabel(def.boost_requirement_type, def.boost_min_hit_markers)}</span> ${fx(def.boost_text)}</span>`;
    else if (it.kind === 'weapon') body = `${statsHTML(it.iid, def)}<span>${fx(def.main_text)}</span><span style="color:var(--muted)">On gather: ${fx(def.gather_text)}</span>`;
    else body = `<span>${fx(def.text)}</span>`;
    return `<button class="lootpick ${on ? 'on' : ''}" data-act="pickloot" data-id="${it.iid}" ${reachIt ? '' : 'disabled'}><span class="lk">${it.kind === 'card' ? 'Tactical card · goes to discard' : it.kind === 'weapon' ? def.cls + ' · weapon' : 'Attachment'}${it.out ? ' · outside' : ' · inside only'}</span><span class="ln"><span>${def.name}</span><span class="cost">${ic('intel')}${cost}</span></span>${body}</button>`;
  }).join('') || '<p style="color:var(--muted)">No loot here yet.</p>'}</div>`;
  if (here && items.length) {
    const opts = [];
    if (weaponSel && me.active && me.back) opts.push(`<span>Replace:</span><button class="btn sm ${S.replace !== 'back' ? 'sig' : 'alt'}" data-act="lootopt" data-id="replace:active">${wdef(me.active).name}</button><button class="btn sm ${S.replace === 'back' ? 'sig' : 'alt'}" data-act="lootopt" data-id="replace:back">${wdef(me.back).name}</button>`);
    if (attSel && me.active && me.back) opts.push(`<span>Mount on:</span><button class="btn sm ${S.attachTo !== 'back' ? 'sig' : 'alt'}" data-act="lootopt" data-id="attach:active">${wdef(me.active).name}</button><button class="btn sm ${S.attachTo === 'back' ? 'sig' : 'alt'}" data-act="lootopt" data-id="attach:back">${wdef(me.back).name}</button>`);
    if (attSel && !me.active && !me.back) opts.push('<span style="color:var(--danger)">You need a weapon to mount an attachment.</span>');
    h += opts.map(o => `<div class="row">${o}</div>`).join('');
    h += `<div class="row"><button class="btn sig" data-act="dolot" ${can && sel.length && total <= me.res.intel ? '' : 'disabled'}>Loot ${sel.length || ''} item${sel.length === 1 ? '' : 's'} · ${total} Intel</button><span style="color:${total > me.res.intel ? 'var(--danger)' : 'var(--muted)'};font-size:13px">You have ${me.res.intel} Intel · one Loot action takes everything selected (max one weapon)</span><button class="btn alt" data-act="close">Cancel</button></div>`;
  }
  return h;
}

    const ch = { salvage: S.salvage };
    const pu = preview(c => WD.playCard(c, ui.me, S.id, null, ch));

    return `${head('Play tactical card')}<div class="cols"><div class="big">${cardHTML(def)}</div><div style="display:grid;gap:8px">

      ${S.boost && salv ? `<h3>Card to salvage permanently</h3><div class="picker">${salv.map(i => cardHTML(WD.cardDef(G, i), { act: 'picksalv', id: i, cls: i === S.salvage ? 'sel' : '' })).join('') || '<span style="color:var(--muted);font-size:13px">Nothing eligible.</span>'}</div>` : ''}

      <div class="row"><button class="btn alt wide" data-act="playcard">Play unboosted</button><button class="btn sig wide" data-act="playboost" ${S.boost ? '' : 'disabled'}>Play boosted</button><button class="btn alt" data-act="close">Cancel</button></div></div></div>`;
  }
  if (S.type === 'weapon') {

      <div class="preview"><div><span class="lbl">Tactical</span>${fx(def.main_text)}</div><div><span class="req">${reqLabel(def.tactical_boost_requirement, def.tactical_boost_min_hit_markers)}</span> ${fx(def.boost_text)}</div></div>
      <h3>Optional Boost card</h3>
      <div class="picker">${me.hand.map(i => cardHTML(WD.cardDef(G, i), { act: 'pickboost', id: i, cls: i === S.boost ? 'sel' : elig.includes(i) ? 'elig' : 'inel', dis: !elig.includes(i) })).join('') || '<span style="color:var(--muted);font-size:13px">No cards in hand to Boost with.</span>'}</div>
      ${conv && S.boost ? `<div class="row"><span>Spend up to</span><span class="stepper"><button data-act="conv" data-id="-1" aria-label="Less">−</button><b>${S.convert}</b><button data-act="conv" data-id="1" aria-label="More">+</button></span><span>${WD.RES_LABEL[conv.from]} → ${WD.RES_LABEL[conv.to]} (max ${conv.max})</span></div>` : ''}
      <div class="preview"><div><span class="lbl">Unboosted</span>${fx(pu)}</div>${pb ? `<div><span class="lbl">Boosted</span>${fx(pb)}</div>` : ''}</div>
      <div class="row"><button class="btn alt wide" data-act="actweapon">Activate unboosted</button><button class="btn sig wide" data-act="actweaponb" ${S.boost ? '' : 'disabled'}>Activate boosted</button></div>
      <div style="font-size:12.5px;color:var(--muted)">Activation is free (no action) and doesn’t use loaded Ammo. The gun stays exhausted this round even if dropped or switched.</div>`;
  }
  if (S.type === 'wview') {

    return `${head(def.name)}<div class="wcard"><div class="w-slot"><span>${def.cls}</span><span class="ready ${W.used ? 'off' : 'on'}">${W.used ? 'Tactical used' : 'Tactical ready'}</span></div><div class="w-body">${weaponBody(def, S.id)}</div></div>`;
  }
  if (S.type === 'fire') {
    const o = OP(); const same = me.pos === o.pos; const sc = WD.shootCheck(G, ui.me);
    let h = head('Fire');
    if (me.active) {
      const def = wdef(me.active);
      if (sc.ok) {
        const br = WD.requiredBreakdown(G, ui.me); const n = S.commit + br.bonusPrec; const chn = WD.hitChance(G, ui.me, n, br.total);
        const E = WD.eff(G, me.active); const tenv = WD.envAt(G, o.pos); const td = WD.ENVS[tenv.def];
        const coverCut = tenv.state === 'safe' && td.cover && o.inside && !(me.pos === o.pos && me.inside) ? Math.min(td.cover, E.damage - 1) : 0;
        const dmgLine = `${E.damage} damage${coverCut ? ` − ${coverCut} cover` : ''}${o.def ? ` − up to ${o.def} Defense` : ''} → <b>${Math.max(0, E.damage - coverCut - o.def)}–${E.damage - coverCut}</b> to Health`;
        h += `<div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div><h3>${def.name}</h3>
        <table class="brk"><tr><td>Weapon Difficulty</td><td>+${br.difficulty}</td></tr><tr><td>Distance ${br.rawDistance} (½, rounded down)</td><td>+${br.distance}</td></tr><tr><td>Recoil (earlier shots × recoil)</td><td>+${br.recoil}</td></tr><tr><td>Target Evasion</td><td>+${br.evasion}</td></tr>${br.suppression ? `<tr><td>Suppression</td><td>+${br.suppression}</td></tr>` : ''}<tr><td>Accuracy modifiers</td><td>−${br.accuracy}</td></tr><tr class="tot"><td>Hit Markers needed</td><td>${br.total}</td></tr></table></div>
        <div style="display:grid;gap:8px;align-content:start"><div class="row"><span>Commit Precision</span><span class="stepper"><button data-act="commit" data-id="-1" aria-label="Less">−</button><b>${S.commit}</b><button data-act="commit" data-id="1" aria-label="More">+</button></span><span style="color:var(--muted)">of ${me.res.prec}${br.bonusPrec ? ` (+${br.bonusPrec} free)` : ''} · reveals ${n} card${n === 1 ? '' : 's'}</span></div>
        <div class="row"><span class="odds">${Math.round(chn * 100)}%</span><span style="color:var(--muted);font-size:13px">estimated from your draw pile. Precision and 1 round are spent even on a miss.</span></div>
        <div class="preview">On a hit: ${dmgLine}.</div>
        <div style="color:var(--muted);font-size:12.5px">Draw pile: ${me.deck.length} card${me.deck.length === 1 ? '' : 's'} with ${me.deck.reduce((a, i) => a + WD.cardDef(G, i).hit_markers, 0)} Hit Markers${me.deck.length < n ? `; your discard (${me.discard.reduce((a, i) => a + WD.cardDef(G, i).hit_markers, 0)} HM) is shuffled in if you run out` : ''}. Cards played this round are not in it.</div>
        <button class="btn sig" data-act="dofire">Fire ${def.name}</button></div></div>`;
      } else h += `<div class="preview">${def.name}: ${sc.err}</div>`;
    }
    h += same ? `<button class="btn ${me.active && sc.ok ? 'alt' : 'sig'}" data-act="dofists">Use Fists · auto-hit, 1 damage</button>` : `<div style="color:var(--muted);font-size:13px">Fists need you in the same zone as ${o.name}.</div>`;
    return h;
  }
  if (S.type === 'loot' || S.type === 'item' || S.type === 'loc') return lootSheet(S);
  if (S.type === 'search') {
    const ps = me.pendingSearch; if (!ps) return head('Search') + '<p>Nothing to choose.</p>';
    const env = WD.envAt(G, ps.w); const sel = S.sel;
    return `${head(`Search · ${envName(env)}${ps.which === 'crate' ? ' crate' : ''}`)}
      <p>Choose <b>${ps.keep}</b> of these ${ps.items.length} to leave ${ps.out ? 'here (outside, anyone can take them)' : 'inside this location'}. The rest go back to the bottom of the loot deck. Taking an item is still a Loot action, paid in Intel — and your rival can grab what you leave.</p>
      <div class="lootlist">${ps.items.map(it => { const def = WD.itemDef(G, it); const on = sel.includes(it.iid);
        let body = it.kind === 'card' ? `${hmPips(def.hit_markers)}<span>${fx(def.main_text)}</span><span style="color:var(--muted)"><span class="req">${reqLabel(def.boost_requirement_type, def.boost_min_hit_markers)}</span> ${fx(def.boost_text)}</span>` : it.kind === 'weapon' ? `${statsHTML(null, def)}<span>${fx(def.main_text)}</span>` : `<span>${fx(def.text)}</span>`;
        return `<button class="lootpick ${on ? 'on' : ''}" data-act="keepsel" data-id="${it.iid}"><span class="lk">${it.kind === 'card' ? 'Tactical card' : it.kind === 'weapon' ? def.cls + ' · weapon' : 'Attachment'}</span><span class="ln"><span>${def.name}</span><span class="cost">${ic('intel')}${WD.lootCost(G, ui.me, it)}</span></span>${body}</button>`; }).join('')}</div>
      <div class="row"><button class="btn sig" data-act="dokeep" ${sel.length === ps.keep ? '' : 'disabled'}>Leave ${sel.length}/${ps.keep} here</button><span style="color:var(--muted);font-size:13px">You can close this and come back; other actions wait until you choose.</span></div>`;
  }
  if (S.type === 'reload') {
    let h = head('Reload');
    for (const sl of ['active', 'back']) { const iid = me[sl]; if (!iid) continue; const W = G.weapons[iid]; const cap = WD.eff(G, iid).magazine_capacity; const need = cap - W.ammo;
      h += `<div class="preview row"><b>${wdef(iid).name}</b> (${sl === 'active' ? 'Active' : 'On back'}) · ${W.ammo}/${cap}<button class="btn sig sm" data-act="doreload" data-id="${sl}" ${need > 0 && me.res.ammo > 0 ? '' : 'disabled'}>Load ${Math.min(need, me.res.ammo)} Ammo</button></div>`; }
    return h + `<div style="color:var(--muted);font-size:13px">Uses generated Ammo (${me.res.ammo}). Loaded Ammo stays between rounds.</div>`;
  }
  if (S.type === 'report') {
    const f = S.f; const who = G.players[f.p].name;
    if (f.fists) return `${head(`${who} · Fists`)}<div class="verdict hit">HIT</div><p>${f.dealt} damage dealt.</p><button class="btn sig" data-act="close">Continue</button>`;
    return `${head(`${who} fires ${f.weapon}`)}
      <div class="row"><span class="lbl">Needed</span><b class="mono" style="font-size:20px">${f.req}</b><span class="lbl">Revealed</span><b class="mono" style="font-size:20px">${f.total}</b></div>
      <div class="reveal">${f.revealed.map(r => `<span class="rv">${hmPips(r.hm)}${r.name}</span>`).join('') || '<span style="color:var(--muted)">No cards revealed (0 Precision committed).</span>'}</div>
      ${f.short ? '<div style="color:var(--muted);font-size:13px">Not enough cards to reveal the full amount.</div>' : ''}
      <div class="verdict ${f.hit ? 'hit' : 'miss'}">${f.hit ? `HIT — ${f.dealt} damage` : 'MISS'}</div>
      <button class="btn sig" data-act="close">Continue</button>`;
  }
  if (S.type === 'over') {
    const w = G.winner; const t = w === 'draw' ? 'Draw' : (ui.mode === 'ai' ? (w === 0 ? 'Victory' : 'Eliminated') : `${G.players[w].name} wins`);
    const st = G.players.map(p => `<tr><td>${p.name}</td><td>${p.stats.hits}/${p.stats.shots}</td><td>${p.stats.damageDealt}</td><td>${p.stats.activations}</td><td>${p.stats.boosts}</td><td>${p.stats.cardsAcquired}</td></tr>`).join('');
    return `${head(t)}<p>Round ${G.round}. ${G.log[G.log.length - 1].msg}</p>
      <table class="brk"><tr><td class="lbl">Operator</td><td class="lbl">Hits</td><td class="lbl">Dmg</td><td class="lbl">Weapon acts</td><td class="lbl">Boosts</td><td class="lbl">Cards looted</td></tr>${st}</table>
      <div class="row"><button class="btn sig" data-act="new" data-id="${ui.mode}">Play again</button><button class="btn alt" data-act="close">See the board</button><button class="btn alt" data-act="home">Main menu</button></div>`;
  }
  if (S.type === 'menu') return `${head('Menu')}<div class="row"><button class="btn alt" data-act="sheet" data-id="rules">How to play</button><button class="btn alt" data-act="sheet" data-id="codex">Card codex</button></div><div class="row"><button class="btn alt" data-act="new" data-id="ai">New match vs AI</button><button class="btn alt" data-act="new" data-id="hotseat">New pass &amp; play</button><button class="btn alt" data-act="home">Main menu</button></div>`;
  if (S.type === 'codex') {
    const tabs = [['weapons', 'Weapons'], ['starter', 'Starter'], ['rungun', 'Run & Gun'], ['entrenched', 'Entrenched'], ['deadeye', 'Deadeye'], ['scavenger', 'Scavenger'], ['atts', 'Attachments'], ['envs', 'Zones']];
    let body = '';
    if (S.tab === 'weapons') body = Object.values(WD.WEAPONS).map(d => `<div class="wcard"><div class="w-slot"><span>${d.cls}</span><span>${WD.WEAPON_COPIES[d.id]} in loot</span></div><div class="w-body">${weaponBodyStatic(d)}</div></div>`).join('');
    else if (S.tab === 'atts') body = Object.values(WD.ATTS).map(a => `<div class="preview"><b>${a.name}</b><span class="cost">${ic('intel')}${a.intel_cost}</span><div>${fx(a.text)}</div></div>`).join('');
    else if (S.tab === 'envs') body = Object.values(WD.ENVS).map(e => `<div class="preview"><b>${e.name}</b><div class="env-stats">${e.entry != null ? `Inside: ${e.entry}${ic('move', 'c-move')}` : 'No inside'} · ${e.cover ? (e.hard ? 'Hard' : 'Soft') + ' cover −' + e.cover : 'No cover'} · cache ${e.search[0]}→${e.search[1]}</div><div>${fx(e.text)}</div></div>`).join('');
    else body = Object.values(WD.CARDS).filter(c => c.archetype === S.tab).map(c => `<div style="display:grid;gap:2px">${cardHTML(c)}<span class="lbl" style="text-align:center">×${c.copies}</span></div>`).join('');
    return `${head('Card codex')}<div class="tabs">${tabs.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-id="${k}">${l}</button>`).join('')}</div><div class="grid-cards">${body}</div>
      <div style="font-size:12.5px;color:var(--muted)">Looted cards that cost 3+ Intel cost 1 less in v2.0. All numbers are prototype values.</div>`;
  }
  if (S.type === 'rules') return `${head('How to play')}<div class="rules">${RULES}</div>`;
  return '';
}
function weaponBodyStatic(def) {
  return `<div class="w-name">${def.name}<span class="cost">${ic('intel')}${def.intel_cost}</span></div><div class="lbl">${def.tags.join(' · ')} · Mag ${def.magazine_capacity}</div>${statsHTML(null, def)}
    <div class="tact">${fx(def.main_text)}<span class="t2"><span class="req">${reqLabel(def.tactical_boost_requirement, def.tactical_boost_min_hit_markers)}</span>${fx(def.boost_text)}</span></div>
    <div class="tact" style="color:var(--muted)">On Gather: ${fx(def.gather_text)}</div>`;
}

const RULES = `
<h4>Goal</h4><ul><li>Two operators, 25 Health each, both start unarmed. Last one standing wins.</li></ul>
<h4>A round</h4><ul>
<li>Draw 5 tactical cards. You get 3 Tactical Actions. Players alternate one action at a time; who goes first is random, then alternates.</li>
<li>Before each action, play any number of cards, activate your Active weapon, use your one free switch and <b>search</b>. None of these costs an action.</li>
<li>Actions: <b>Move</b>, <b>Fire</b>, <b>Loot</b>, <b>Reload</b>, <b>Wait</b>. <b>Finish</b> forfeits the rest.</li>
<li>At round end, unspent Movement, Precision and Ammo expire. Intel carries over. Loaded Ammo stays.</li></ul>
<h4>Moving: outside and inside</h4><ul>
<li>The golden rule: <b>every space costs 1 Movement</b>, whatever is there. You arrive <b>outside</b> (your card at the bottom of the location).</li>
<li><b>Going inside</b> costs the location’s entry (shown as “In 2”). Inside you get its <b>cover</b>, its <b>bonus</b> (once per round) and access to its <b>cache</b>. Leaving is free.</li>
<li><b>One operator inside each location.</b> To get in anyway, <b>Breach</b> for +1 Movement: you’re both inside at close quarters and nobody gets cover.</li>
<li>Outside you have no cover. Hard cover still blocks shots that pass through a location.</li></ul>
<h4>The circle</h4><ul>
<li>11 locations. At each round end the gas takes one edge, alternating sides; the first player’s side closes first. Gas at round end: −2 Health.</li>
<li>When one location is left, <b>the walls are down</b>: nobody can be inside, and the storm hits both operators every round (2, 3, 4…).</li></ul>
<h4>Loot: search and draft</h4><ul>
<li>Each location has a <b>cache</b> (e.g. “Cache 4→2”). Search it from inside (free): reveal 4, choose 2 to leave there, the rest go back.</li>
<li>Each round a <b>supply crate</b> lands near the centre: search it from outside, keep 3 of 6 (2 weapons, 4 others).</li>
<li>Taking items is a <b>Loot</b> action: any number you can reach, paid in Intel. What you leave, your rival can take.</li></ul>
<h4>Boosting</h4><ul>
<li>Any card or equipped weapon can be fuelled by one other card from your hand. The fuel card’s own effects don’t happen.</li>
<li>The BOOST tag shows the requirement: an empty ring means any card; filled markers mean a card with that many Hit Markers or more.</li></ul>
<h4>Firing</h4><ul>
<li>Hit Markers needed = Difficulty + half the Distance + Recoil + target Evasion − accuracy, minimum 1. Commit Precision to reveal that many cards.</li>
<li>Cover only protects someone <b>inside</b>, and not against someone inside with them. Defense absorbs damage. Fists: same location, auto-hit for 1.</li></ul>
<h4>Tips</h4><ul><li>Hold anything for an explanation. Recon Tower gives +2 Precision when you enter; Bunker +2 Defense; House draws a card; Supply Depot +1 Intel.</li></ul>`;


// ---------- flow ----------
function toast(msg) { ui.toast = msg; clearTimeout(ui.toastT); ui.toastT = setTimeout(() => { ui.toast = null; renderLayer(); }, 2600); renderLayer(); }
function newMatch(mode) {
  ui.mode = mode; ui.me = 0; ui.sheet = null; ui.moveMode = false; ui.busy = false; ui.handoff = false; ui.screen = 'game'; ui.seenFire = null;
  G = WD.newGame({ mode, names: mode === 'ai' ? ['Alpha', 'Rival'] : ['Operator 1', 'Operator 2'] });
  render(); after();
}
function act(fn) {
  const r = fn(); if (!r || !r.ok) { toast(r ? r.err : 'Not allowed.'); return; }
  ui.sheet = null; ui.moveMode = false; after();
}
function after() {
  if (G.lastFire && G.lastFire !== ui.seenFire) { ui.seenFire = G.lastFire; ui.sheet = { type: 'report', f: G.lastFire }; }
  if (G.over && (!ui.sheet || ui.sheet.type !== 'report')) ui.sheet = { type: 'over' };
  if (ui.mode === 'hotseat' && !G.over && G.turn !== ui.me) ui.handoff = true;
  render();
  if (ui.mode === 'ai' && !G.over && G.turn === 1 && !(ui.sheet && ui.sheet.type === 'report')) {
    ui.busy = true; render();
    setTimeout(() => { WD.aiStep(G, 1); ui.busy = false; after(); }, 750);
  }
}

document.addEventListener('click', e => {
  if (LP.suppress) { LP.suppress = false; e.preventDefault(); e.stopPropagation(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'scrim') { if (e.target === el && ui.sheet && ui.sheet.type !== 'over') closeSheet(); return; }
  const S = ui.sheet;
  switch (a) {
    case 'new': newMatch(id); break;
    case 'home': ui.screen = 'start'; ui.sheet = null; G = null; render(); break;
    case 'sheet': ui.sheet = { type: id, tab: 'weapons' }; renderLayer(); break;
    case 'close': closeSheet(); break;
    case 'tab': S.tab = id; renderLayer(); break;
    case 'takeover': ui.me = G.turn; ui.handoff = false; render(); break;
    case 'card': if (!myTurn()) return toast('Wait for your turn.'); ui.sheet = { type: 'card', id, boost: null, salvage: null }; renderLayer(); break;
    case 'pickboost': S.boost = S.boost === id ? null : id; if (S.salvage === id) S.salvage = null; renderLayer(); break;
    case 'picksalv': S.salvage = id; renderLayer(); break;
    case 'playcard': act(() => WD.playCard(G, ui.me, S.id, null, { salvage: S.salvage })); break;
    case 'playboost': act(() => WD.playCard(G, ui.me, S.id, S.boost, { salvage: S.salvage })); break;
    case 'activate': { const def = wdef(ME().active); const conv = def.tactical_boost_effects.find(x => x.op === 'convert'); ui.sheet = { type: 'weapon', boost: null, convert: conv ? conv.max : 0 }; renderLayer(); break; }
    case 'conv': { const def = wdef(ME().active); const conv = def.tactical_boost_effects.find(x => x.op === 'convert'); S.convert = Math.max(0, Math.min(conv.max, S.convert + (+id))); renderLayer(); break; }
    case 'actweapon': act(() => WD.activateWeapon(G, ui.me, null, {})); break;
    case 'actweaponb': act(() => WD.activateWeapon(G, ui.me, S.boost, { convert: S.convert })); break;
    case 'wview': ui.sheet = { type: 'wview', id }; renderLayer(); break;
    case 'switch': act(() => WD.switchWeapons(G, ui.me)); break;
    case 'move': if (!ME().res.move && !ui.moveMode) return toast('You have no Movement. Play a Movement card first.'); ui.moveMode = !ui.moveMode; render(); if (ui.moveMode && !WD.reachable(G, ui.me).length) toast('No zone is reachable with your current Movement.'); break;
    case 'moveto': act(() => WD.actMove(G, ui.me, +id, { inside: el.dataset.x === 'in' })); break;
    case 'loc': ui.sheet = { type: 'loc', w: +id, sel: [] }; renderLayer(); break;
    case 'search': { const r = WD.searchStart(G, ui.me); if (!r.ok) return toast(r.err); if (r.empty) { toast('Nothing left to find here.'); render(); break; } ui.sheet = { type: 'search', sel: [] }; render(); break; }
    case 'searchopen': ui.sheet = { type: 'search', sel: [] }; renderLayer(); break;
    case 'keepsel': { const ps = ME().pendingSearch; const i = S.sel.indexOf(id); if (i >= 0) S.sel.splice(i, 1); else if (S.sel.length < ps.keep) S.sel.push(id); else { S.sel.shift(); S.sel.push(id); } renderLayer(); break; }
    case 'dokeep': act(() => WD.searchKeep(G, ui.me, S.sel)); break;
    case 'fire': ui.sheet = { type: 'fire', commit: ME().res.prec }; renderLayer(); break;
    case 'commit': S.commit = Math.max(0, Math.min(ME().res.prec, S.commit + (+id))); renderLayer(); break;
    case 'dofire': act(() => WD.actFire(G, ui.me, { commit: S.commit })); break;
    case 'dofists': act(() => WD.actFire(G, ui.me, { fists: true })); break;
    case 'loot': ui.sheet = { type: 'loot', sel: [] }; renderLayer(); break;
    case 'item': ui.sheet = { type: 'item', id, sel: [] }; renderLayer(); break;
    case 'pickloot': { const i = S.sel.indexOf(id); if (i >= 0) S.sel.splice(i, 1); else S.sel.push(id); renderLayer(); break; }
    case 'lootopt': { const [k, v] = id.split(':'); if (k === 'replace') S.replace = v; else S.attachTo = v; renderLayer(); break; }
    case 'dolot': act(() => WD.actLoot(G, ui.me, S.sel, { replace: S.replace || 'active', attachTo: S.attachTo })); break;
    case 'reload': { const me = ME(); if (!['active', 'back'].some(s => me[s])) return toast('No weapon to reload.'); ui.sheet = { type: 'reload' }; renderLayer(); break; }
    case 'doreload': act(() => WD.actReload(G, ui.me, { slot: id })); break;
    case 'wait': act(() => WD.actWait(G, ui.me)); break;
    case 'finish': act(() => WD.finish(G, ui.me)); break;
  }
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (ui.sheet && ui.sheet.type !== 'over') closeSheet(); else if (ui.moveMode) { ui.moveMode = false; render(); } }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.act === 'moveto') { e.preventDefault(); e.target.click(); }
});
function closeSheet() { const wasReport = ui.sheet && ui.sheet.type === 'report'; ui.sheet = null; if (wasReport) after(); else renderLayer(); }

/* ---------- hold for info (touch) / hover (mouse) ---------- */
const LP = { timer: null, x: 0, y: 0, el: null, shown: false, suppress: false };
function showTip(text, x, y) {
  let pop = document.getElementById('tipPop');
  if (!pop) { pop = document.createElement('div'); pop.id = 'tipPop'; pop.className = 'tip-pop'; pop.setAttribute('role', 'tooltip'); document.body.appendChild(pop); }
  pop.textContent = text; pop.hidden = false;
  const r = pop.getBoundingClientRect();
  const left = Math.min(Math.max(10, x - r.width / 2), innerWidth - r.width - 10);
  let top = y - r.height - 24; if (top < 8) top = Math.min(y + 24, innerHeight - r.height - 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function hideTip() { const pop = document.getElementById('tipPop'); if (pop) pop.hidden = true; if (LP.el) LP.el.classList.remove('holding'); LP.el = null; LP.shown = false; }
document.addEventListener('pointerdown', e => {
  if (LP.shown && e.pointerType !== 'mouse') { hideTip(); LP.suppress = true; return; }
  LP.suppress = false;
  if (e.pointerType === 'mouse') { clearTimeout(LP.timer); hideTip(); return; }
  clearTimeout(LP.timer); LP.x = e.clientX; LP.y = e.clientY;
  const t = e.target.closest('[data-tip]');
  if (!t) return;
  LP.timer = setTimeout(() => {
    LP.el = t; t.classList.add('holding'); LP.shown = true; LP.suppress = true;
    showTip(t.dataset.tip, LP.x, LP.y);
  }, 430);
}, true);
document.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') {
    const t = e.target.closest('[data-tip]');
    if (t && t !== LP.el) { if (LP.el) LP.el.classList.remove('holding'); LP.el = t; clearTimeout(LP.timer); LP.timer = setTimeout(() => { if (LP.el === t) showTip(t.dataset.tip, e.clientX, e.clientY); }, 550); }
    else if (!t && LP.el) { clearTimeout(LP.timer); hideTip(); }
    return;
  }
  if (LP.timer && !LP.shown && Math.hypot(e.clientX - LP.x, e.clientY - LP.y) > 10) clearTimeout(LP.timer);
}, true);
document.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') { clearTimeout(LP.timer); if (LP.el) LP.el.classList.remove('holding'); } }, true);
document.addEventListener('pointercancel', () => clearTimeout(LP.timer), true);
document.addEventListener('contextmenu', e => { if (e.target.closest('#app, #layer')) e.preventDefault(); });

render();
})();

</script>
